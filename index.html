<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>港湾・資材 現場一覧</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--blue:#0b57d0;--bg:#f5f7fb;--line:#e3e7ef;}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:var(--bg);color:#202124}
header{background:var(--blue);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:1000;box-shadow:0 2px 8px #0002}
h1{font-size:20px;margin:0 0 8px} .count{font-size:12px;opacity:.9}
.tabs{display:flex;gap:8px} .tab{flex:1;border:1px solid #ffffff88;background:#ffffff22;color:#fff;padding:9px;border-radius:10px;font-weight:700}
.tab.active{background:#fff;color:var(--blue)}
main{padding:12px;max-width:1000px;margin:auto} .panel{display:none} .panel.active{display:block}
#map{height:58vh;min-height:420px;border-radius:14px;overflow:hidden;background:#ddd;box-shadow:0 2px 8px #0002}
.controls{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap} input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 0 4px;white-space:nowrap} .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13px} .chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
#list{display:grid;gap:9px;margin-top:10px} .card{background:#fff;border-radius:14px;padding:13px;box-shadow:0 1px 5px #0001;border:1px solid var(--line)}
.name{font-size:17px;font-weight:800;margin-bottom:4px} .meta{font-size:13px;color:#5f6368;margin-bottom:10px}
.actions{display:flex;gap:7px;flex-wrap:wrap} .btn{text-decoration:none;background:#f1f5ff;color:var(--blue);padding:9px 11px;border-radius:9px;font-weight:700;font-size:14px;border:1px solid #d8e4ff} .btn.primary{background:var(--blue);color:#fff}
.leaflet-popup-content .popup-name{font-weight:800;font-size:15px;margin-bottom:5px}
.leaflet-popup-content .popup-actions a{display:inline-block;margin:4px 4px 0 0;padding:7px 9px;border-radius:7px;background:#eef3ff;color:#0b57d0;text-decoration:none;font-weight:700;font-size:12px}
.note{font-size:12px;color:#5f6368;margin:8px 2px}
</style>
</head>
<body>
<header>
  <h1>港湾・資材 現場一覧 <span class="count" id="count"></span></h1>
  <div class="tabs">
    <button class="tab active" data-tab="mapPanel">地図から探す</button>
    <button class="tab" data-tab="searchPanel">現場名・都道府県で検索</button>
  </div>
</header>
<main>
<section id="mapPanel" class="panel active">
  <div class="chips" id="mapChips"></div>
  <div id="map"></div>
  <div class="note">ピンをタップすると「地図・図面・写真」を開けます。</div>
</section>
<section id="searchPanel" class="panel">
  <input id="search" placeholder="現場名・都道府県で検索">
  <div class="chips" id="searchChips"></div>
  <div id="list"></div>
</section>
</main>
