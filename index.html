<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>現場ナビ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS (地図用) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* 横スクロールバーを非表示にするスタイリング */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased selection:bg-blue-200">

    <div class="max-w-md mx-auto min-h-screen bg-gray-50 flex flex-col shadow-lg relative">

        <!-- ヘッダー -->
        <header class="p-4 bg-white border-b flex items-center justify-between sticky top-0 z-30">
            <div class="flex items-center gap-2">
                <span class="text-2xl">⚓️</span>
                <h1 class="text-xl font-bold tracking-tight text-gray-900">現場ナビ</h1>
                <span id="total-badge" class="text-sm font-normal text-gray-500">192件</span>
            </div>
        </header>

        <!-- メインコンテンツ領域 -->
        <div class="p-4 flex flex-col gap-3">

            <!-- マップから探す ボタン -->
            <button id="toggle-map-btn" onclick="toggleMapModal()" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3.5 px-4 rounded-xl shadow-md flex items-center justify-center gap-2 text-lg transition">
                <span>🗺️</span>
                <span>マップから探す</span>
            </button>

            <!-- 都道府県・キーワード検索バー -->
            <div class="relative">
                <input type="text" id="search-input" placeholder="都道府県で検索" 
                       class="w-full bg-white border border-gray-300 rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm">
            </div>

            <!-- 件数表示 -->
            <div id="count-display" class="text-sm text-gray-500 font-medium px-1 pt-1">
                192件表示
            </div>

            <!-- 地域絞り込みタブ（横スクロール） -->
            <div class="flex gap-2 overflow-x-auto no-scrollbar py-1 -mx-4 px-4" id="region-tabs">
                <button onclick="filterByRegion('ALL')" class="region-tab shrink-0 px-5 py-2 rounded-full font-bold text-sm bg-gray-800 text-white shadow-sm">
                    全192件
                </button>
                <button onclick="filterByRegion('北海道')" class="region-tab shrink-0 px-5 py-2 rounded-full font-medium text-sm bg-white border border-gray-300 text-gray-700 shadow-sm">
                    北海道
                </button>
                <button onclick="filterByRegion('東北')" class="region-tab shrink-0 px-5 py-2 rounded-full font-medium text-sm bg-white border border-gray-300 text-gray-700 shadow-sm">
                    東北
                </button>
                <button onclick="filterByRegion('関東')" class="region-tab shrink-0 px-5 py-2 rounded-full font-medium text-sm bg-white border border-gray-300 text-gray-700 shadow-sm">
                    関東
                </button>
                <button onclick="filterByRegion('中部')" class="region-tab shrink-0 px-5 py-2 rounded-full font-medium text-sm bg-white border border-gray-300 text-gray-700 shadow-sm">
                    中部
                </button>
                <button onclick="filterByRegion('近畿')" class="region-tab shrink-0 px-5 py-2 rounded-full font-medium text-sm bg-white border border-gray-300 text-gray-700 shadow-sm">
                    近畿
                </button>
                <button onclick="filterByRegion('中国')" class="region-tab shrink-0 px-5 py-2 rounded-full font-medium text-sm bg-white border border-gray-300 text-gray-700 shadow-sm">
                    中国
                </button>
                <button onclick="filterByRegion('四国')" class="region-tab shrink-0 px-5 py-2 rounded-full font-medium text-sm bg-white border border-gray-300 text-gray-700 shadow-sm">
                    四国
                </button>
                <button onclick="filterByRegion('九州')" class="region-tab shrink-0 px-5 py-2 rounded-full font-medium text-sm bg-white border border-gray-300 text-gray-700 shadow-sm">
                    九州
                </button>
            </div>

            <!-- 現場リスト出力エリア -->
            <div id="genba-list" class="flex flex-col gap-6 mt-2 pb-12">
                <!-- Javascriptからカードが動的に挿入されます -->
            </div>

        </div>

        <!-- マップ用モーダル画面 -->
        <div id="map-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex flex-col">
            <div class="bg-white p-3 flex justify-between items-center border-b">
                <span class="font-bold text-gray-800">現場マップ</span>
                <button onclick="toggleMapModal()" class="text-gray-500 font-bold px-3 py-1 bg-gray-100 rounded-lg">閉じる ✕</button>
            </div>
            <div id="map" class="w-full flex-1"></div>
        </div>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- 先ほど作成した全192件のデータ -->
    <script src="genba_data.js"></script>

    <script>
        let currentRegion = 'ALL';
        let searchQuery = '';
        let mapInitialized = false;
        let map, markersLayer;

        const listContainer = document.getElementById('genba-list');
        const countDisplay = document.getElementById('count-display');
        const searchInput = document.getElementById('search-input');

        // 地域フィルター切り替え
        function filterByRegion(region) {
            currentRegion = region;
            
            // タブのスタイリング切り替え
            document.querySelectorAll('.region-tab').forEach(tab => {
                if ((region === 'ALL' && tab.textContent.includes('全')) || tab.textContent.trim() === region) {
                    tab.className = 'region-tab shrink-0 px-5 py-2 rounded-full font-bold text-sm bg-gray-800 text-white shadow-sm';
                } else {
                    tab.className = 'region-tab shrink-0 px-5 py-2 rounded-full font-medium text-sm bg-white border border-gray-300 text-gray-700 shadow-sm';
                }
            });

            renderList();
        }

        // 検索機能イベント
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            renderList();
        });

        // 現場リストの描画
        function renderList() {
            // フィルタリング処理
            const filtered = genbaData.filter(item => {
                const matchRegion = currentRegion === 'ALL' || item.region === currentRegion;
                const matchSearch = !searchQuery || 
                                    item.name.toLowerCase().includes(searchQuery) || 
                                    item.pref.toLowerCase().includes(searchQuery) ||
                                    item.region.toLowerCase().includes(searchQuery);
                return matchRegion && matchSearch;
            });

            countDisplay.textContent = `${filtered.length}件表示`;

            // 地方ごとにグループ化
            const grouped = {};
            filtered.forEach(item => {
                if (!grouped[item.region]) grouped[item.region] = [];
                grouped[item.region].push(item);
            });

            listContainer.innerHTML = '';

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-gray-400 py-10">該当する現場が見つかりません</div>`;
                return;
            }

            // 地域ごとのセクション生成
            for (const regionName in grouped) {
                const items = grouped[regionName];
                
                const section = document.createElement('div');
                section.className = 'flex flex-col gap-3';

                // 地域タイトル（スクリーンショットと同じデザイン）
                section.innerHTML = `
                    <div class="flex items-center gap-2 border-l-4 border-gray-800 pl-2 mt-2">
                        <h2 class="text-xl font-bold text-gray-900">${regionName}</h2>
                        <span class="text-gray-500 font-normal">(${items.length}件)</span>
                    </div>
                `;

                // カード一覧
                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-2xl p-4 shadow-sm border border-gray-200/80 flex flex-col gap-2';

                    // 写真サムネイルの描画
                    let photoHtml = '';
                    if (item.photos && item.photos.length > 0) {
                        // Google Driveリンクを画像表示用リンクに変換
                        const photoUrl = item.photos[0];
                        const driveIdMatch = photoUrl.match(/\/d\/([^\/]+)/);
                        const displayUrl = driveIdMatch ? `https://lh3.googleusercontent.com/d/${driveIdMatch[1]}` : photoUrl;

                        photoHtml = `
                            <a href="${photoUrl}" target="_blank" class="block w-36 h-24 rounded-lg overflow-hidden bg-gray-100 border relative group">
                                <img src="${displayUrl}" alt="${item.name}" class="w-full h-full object-cover" loading="lazy" onError="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                                <div class="hidden absolute inset-0 bg-gray-200 text-xs text-gray-500 items-center justify-center text-center p-1">写真を開く</div>
                            </a>
                        `;
                    }

                    card.innerHTML = `
                        <div class="text-xs font-bold text-gray-500">${item.pref}</div>
                        <h3 class="text-lg font-bold text-gray-900 leading-snug">${item.name}</h3>
                        <div class="text-xs text-gray-400 font-mono">${item.lat}, ${item.lng}</div>

                        ${photoHtml}

                        <!-- タップしてGoogleマップ ボタン -->
                        <a href="https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}" 
                           target="_blank" 
                           class="mt-1 w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 text-base transition">
                            <span>📍</span>
                            <span>タップしてGoogleマップ</span>
                        </a>

                        ${item.photos.length > 0 ? `
                            <div class="text-xs text-gray-500 pt-1">
                                <a href="${item.photos[0]}" target="_blank" class="hover:underline">図面を開く</a>
                            </div>
                        ` : ''}
                    `;

                    section.appendChild(card);
                });

                listContainer.appendChild(section);
            }

            // マーカーも更新
            if (mapInitialized) updateMapMarkers(filtered);
        }

        // マップ表示・切り替え
        function toggleMapModal() {
            const modal = document.getElementById('map-modal');
            modal.classList.toggle('hidden');

            if (!modal.classList.contains('hidden')) {
                if (!mapInitialized) {
                    initMap();
                    mapInitialized = true;
                } else {
                    map.invalidateSize();
                }
            }
        }

        // 地図の初期化
        function initMap() {
            map = L.map('map').setView([36.5, 137.5], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            markersLayer = L.layerGroup().addTo(map);
            renderList();
        }

        // 地図のピン更新
        function updateMapMarkers(data) {
            markersLayer.clearLayers();
            const bounds = [];

            data.forEach(item => {
                bounds.push([item.lat, item.lng]);
                const marker = L.marker([item.lat, item.lng]);
                marker.bindPopup(`
                    <b>${item.name}</b><br>
                    <span class="text-xs text-gray-500">${item.pref}</span><br>
                    <a href="https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}" target="_blank" class="text-blue-600 underline text-xs">Googleマップで開く</a>
                `);
                markersLayer.addLayer(marker);
            });

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [20, 20], maxZoom: 14 });
            }
        }

        // 初期表示
        renderList();
    </script>
</body>
</html>
